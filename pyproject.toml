[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cli-avatars"
version = "0.4.0"
description = "Animated desktop avatars for local AI coding sessions"
license = { text = "Proprietary" }
requires-python = ">=3.10"
classifiers = [
    "License :: Other/Proprietary License",
]

[project.scripts]
cli-avatars-emit = "cli_avatars_emit:main"

[project.optional-dependencies]
dev = ["ruff>=0.9"]

[tool.setuptools]
py-modules = [
    "activity",
    "bundle_paths",
    "bubbles",
    "chat_window",
    "chatlog",
    "claude_chat_hooks",
    "cli_avatars_emit",
    "context_packs",
    "decisions",
    "emit_app",
    "emit_phone",
    "emit_tasks",
    "events",
    "focus",
    "harness",
    "hud",
    "inbox",
    "mailroom",
    "meetings",
    "needs_you",
    "overlay",
    "perchas",
    "portal",
    "recap",
    "redaction",
    "rooms",
    "routing",
    "sandbox",
    "sessions",
    "sprite_loader",
    "standup",
    "subskins",
    "timelapse",
    "topics",
    "win32",
]

[tool.setuptools.packages.find]
include = ["cli_avatars", "cli_avatars.*", "cli_avatars_mcp", "bots", "bots.*", "board", "registry", "resources"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"subprocess".msg = "subprocess stays in cli_avatars.runner"

[tool.ruff.lint.per-file-ignores]
# Legacy top-level modules stay as they are, apart from real pyflakes errors.
"activity.py" = ["E", "W", "I", "B"]
"bundle_paths.py" = ["E", "W", "I", "B"]
"bubbles.py" = ["E", "W", "I", "B"]
"chat_window.py" = ["E", "W", "I", "B"]
"chatlog.py" = ["E", "W", "I", "B"]
"claude_chat_hooks.py" = ["E", "W", "I", "B"]
"cli_avatars_emit.py" = ["E", "W", "I", "B"]
"decisions.py" = ["E", "W", "I", "B"]
"events.py" = ["E", "W", "I", "B"]
"hud.py" = ["E", "W", "I", "B"]
"inbox.py" = ["E", "W", "I", "B"]
"meetings.py" = ["E", "W", "I", "B"]
"overlay.py" = ["E", "W", "I", "B"]
"perchas.py" = ["E", "W", "I", "B"]
"portal.py" = ["E", "W", "I", "B"]
"rooms.py" = ["E", "W", "I", "B"]
"routing.py" = ["E", "W", "I", "B"]
"sessions.py" = ["E", "W", "I", "B"]
"sprite_loader.py" = ["E", "W", "I", "B"]
"subskins.py" = ["E", "W", "I", "B"]
"topics.py" = ["E", "W", "I", "B"]
"win32.py" = ["E", "W", "I", "B"]
"hooks/**" = ["E", "W", "I", "B"]
"tests/**" = ["E", "W", "I", "B"]
"tools/**" = ["E", "W", "I", "B"]
"cli_avatars_mcp/**" = ["E", "W", "I", "B"]
"cli_avatars/runner/**" = ["TID"]
# The updater and the installer script start git, Python, and PyInstaller.
# Argv is a fixed list and shell is false. Chat text never reaches them.
"cli_avatars/update/proc.py" = ["TID"]
"tools/build_installer.py" = ["TID"]
"packaging/cli_avatars.spec" = ["TID"]
# Git fetch for bot status. Argv is fixed and shell is false. Not a model CLI.
"bots/status_source.py" = ["TID251"]
