<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120e18">
<title>Dungeon</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<main id="app">
  <section class="pane map-pane" aria-label="Dungeon map">
    <header class="bar">
      <h1><span class="torch" aria-hidden="true"></span>Dungeon</h1>
      <span id="here" class="here"></span>
      <span id="live" class="live" title="Live updates"></span>
      <button id="sound" class="icon" type="button" aria-pressed="false" title="Sound on zoom">&#9835;</button>
      <button id="fit" class="icon" type="button" title="Whole map">&#10530;</button>
    </header>
    <div class="stage"><canvas id="map"></canvas></div>
  </section>
  <section class="pane tasks-pane" aria-label="Tasks">
    <header class="bar"><h2>Tasks</h2><span id="count" class="count"></span></header>
    <ul id="tasks" class="tasks"></ul>
  </section>
  <section class="pane chat-pane" aria-label="Room chat">
    <header class="bar"><h2>Room chat</h2><span id="chatRoom" class="chat-room"></span></header>
    <ol id="chat" class="chat"></ol>
  </section>
</main>
<script src="/static/app.js"></script>
</body>
</html>
