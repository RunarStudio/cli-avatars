<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>CLI Avatars Skin Select</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: arcade "character select" — roster of cards left, big stage centre, agent + tint panel right. One dark world on purpose. */
:root{
  --night:#141526;      /* page */
  --panel:#1d1f36;      /* panels */
  --slot:#262948;       /* card fill */
  --line:#3a3e6b;       /* indigo outline, like his knight style */
  --ink:#e8e6f4;        /* text */
  --dim:#9a98b8;        /* secondary text */
  --select:#ffcf4a;     /* selection cursor */
  --ground:#c6cccf;     /* stage floor, the sheets' old background */
  --display:"Silkscreen","Courier New",monospace;
  --body:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--night);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
.wrap{max-width:1120px;margin:0 auto;display:grid;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px}
h1{font-family:var(--display);font-size:28px;margin:0;letter-spacing:.04em;text-wrap:balance}
.tag{font-size:12px;color:var(--dim);border:1px dashed var(--line);padding:2px 8px}
.grid{display:grid;grid-template-columns:260px minmax(0,1fr) 280px;gap:16px}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
.panel{background:var(--panel);border:2px solid var(--line);padding:14px;min-width:0;display:grid;gap:12px;align-content:start}
.label{font-family:var(--display);font-size:12px;letter-spacing:.08em;color:var(--dim);text-transform:uppercase}
.roster{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (max-width:900px){.roster{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}}
.card{background:var(--slot);border:2px solid var(--line);padding:6px 6px 8px;display:grid;gap:4px;justify-items:center;cursor:pointer;color:var(--ink);font:inherit;position:relative}
.card:hover{border-color:var(--dim)}
.card:focus-visible,.btn:focus-visible,.state:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--select);outline-offset:2px}
.card[aria-pressed="true"]{border-color:var(--select);box-shadow:0 0 0 2px var(--night),0 0 0 4px var(--select)}
.card[aria-pressed="true"]::after{content:"P1";position:absolute;top:-10px;left:-6px;background:var(--select);color:var(--night);font-family:var(--display);font-size:10px;padding:0 4px}
.card canvas{width:128px;height:128px;max-width:100%;image-rendering:pixelated}
.card .nm{font-family:var(--display);font-size:11px;text-align:center}
.card.locked{cursor:default;opacity:.55}
.card.locked .ph{width:100px;height:100px;display:grid;place-items:center;font-family:var(--display);font-size:22px;color:var(--line)}
.stage{background:var(--panel);border:2px solid var(--line);padding:14px;display:grid;gap:12px;min-width:0;align-content:start}
.screen{position:relative;background:var(--night);border:2px solid var(--line);max-width:100%;padding-top:28px}
.screen canvas{display:block;width:100%;height:auto;image-rendering:pixelated}
.hud{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;font-family:var(--display);font-size:12px}
.hud b{color:var(--select)}
.states{display:flex;flex-wrap:wrap;gap:6px}
.state{background:var(--slot);border:2px solid var(--line);color:var(--ink);font:inherit;font-size:12px;padding:4px 8px;cursor:pointer;display:grid;text-align:left}
.state small{color:var(--dim);font-size:11px}
.state[aria-pressed="true"]{border-color:var(--select)}
.meta{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:12px;font-variant-numeric:tabular-nums}
.meta dt{color:var(--dim)} .meta dd{margin:0}
select,input[type=range]{width:100%;font:inherit;background:var(--slot);color:var(--ink);border:2px solid var(--line);padding:6px}
input[type=range]{padding:0;accent-color:var(--select)}
.sessions{display:grid;gap:6px}
.sess{display:flex;gap:8px;align-items:center;font-size:12px;background:var(--slot);border:2px solid var(--line);padding:6px}
.sess canvas{width:48px;height:48px;image-rendering:pixelated}
.sess .st{margin-left:auto;font-size:11px;color:var(--dim)}
.btn{font-family:var(--display);font-size:16px;background:var(--select);color:var(--night);border:0;padding:10px;cursor:pointer;box-shadow:4px 4px 0 var(--line)}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--line)}
.toast{font-size:12px;color:var(--select);min-height:1.5em}
.note{font-size:12px;color:var(--dim)}
@media (prefers-reduced-motion:reduce){.btn:active{transform:none}}
</style>

<div class="wrap">
  <header>
    <h1>Elige tu skin</h1>
    <span class="tag">Concepto · datos de sesiones de ejemplo</span>
  </header>
  <div class="grid">
    <section class="panel" aria-label="Skins">
      <div class="label">Skins · 8 con sprite</div>
      <div class="roster" id="roster"></div>
      <p class="note">Sprites reales de <code>Sprites/</code>, a su tamaño real. Ritmo de los antiguos: 150 ms por frame (supuesto).</p>
    </section>

    <section class="stage" aria-label="Vista previa">
      <div class="screen">
        <div class="hud"><span id="hudName">—</span><span>estado: <b id="hudState">idle</b></span></div>
        <canvas id="big" width="96" height="72"></canvas>
      </div>
      <div class="label">Estado del agente → animación</div>
      <div class="states" id="states"></div>
      <dl class="meta" id="meta"></dl>
    </section>

    <section class="panel" aria-label="Aplicar">
      <div class="label">Agente</div>
      <select id="agent" aria-label="Agente"></select>
      <div class="label">Tono <span id="hueVal">0°</span></div>
      <input type="range" id="hue" min="0" max="345" step="15" value="0" aria-label="Tono">
      <button class="btn" id="apply">Aplicar skin</button>
      <div class="toast" id="toast" role="status"></div>
      <div class="label">En pantalla ahora</div>
      <div class="sessions" id="sessions"></div>
    </section>
  </div>
</div>

];
const GROUND = getComputedStyle(document.documentElement).getPropertyValue("--ground").trim() || "#c6cccf";
const BOX = 64; // every canvas is 64×64; sprites keep their real size, feet on the same floor line
let sel = "ember_mage", anim = 0, hue = 0;
const byId = Object.fromEntries(SKINS.map(s=>[s.id,s]));
const imgs = {};
const draws = []; // {cv, skin(), anim(), hue(), t0}

function mkCanvas(){const c=document.createElement("canvas");c.width=BOX;c.height=BOX;return c;}
function ms(s,ai){return (s.ms&&s.ms[ai])||[s.dflt||150];}
function frameAt(s, ai, t){const n=s.rows[ai]||0; if(n<1) return -1; const m=ms(s,ai);
  const durs=Array.from({length:n},(_,i)=>m.length>1?m[i]:m[0]); const total=durs.reduce((x,y)=>x+y,0);
  let k=t%total; for(let i=0;i<n;i++){if(k<durs[i]) return i; k-=durs[i];} return 0;}
function paint(cv, skin, ai, h, t){
  const ctx=cv.getContext("2d"); ctx.clearRect(0,0,cv.width,cv.height);
  if(cv.height>BOX){ctx.fillStyle=GROUND; ctx.fillRect(0,BOX,cv.width,cv.height-BOX);} // stage floor, feet stand on y=BOX
  const s=byId[skin], im=imgs[skin]; if(!s||!im||!im.complete) return;
  let row=ai, f=frameAt(s,row,t); if(f<0){row=0; f=frameAt(s,0,t);}
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(im, f*s.fw, row*s.fh, s.fw, s.fh, Math.floor((cv.width-s.fw)/2), BOX-(s.base||s.fh), s.fw, s.fh); // feet on the canvas bottom
  cv.style.filter = h ? `hue-rotate(${h}deg)` : "";
}
function loop(t){ for(const d of draws) paint(d.cv, d.skin(), d.anim(), d.hue(), t); requestAnimationFrame(loop); }

for(const s of SKINS) if(s.src){const im=new Image(); im.src=s.src; imgs[s.id]=im;}

// roster
const roster=document.getElementById("roster");
for(const s of SKINS){
  const b=document.createElement(s.locked?"div":"button");
  b.className="card"+(s.locked?" locked":"");
  if(s.locked){ b.innerHTML=`<div class="ph">?</div><div class="nm">${s.name}</div>`; }
  else{
    b.type="button"; b.setAttribute("aria-pressed", s.id===sel);
    const cv=mkCanvas(); b.append(cv);
    const nm=document.createElement("div"); nm.className="nm"; nm.textContent=s.name; b.append(nm);
    draws.push({cv, skin:()=>s.id, anim:()=>0, hue:()=>0});
    b.addEventListener("click",()=>{sel=s.id; refresh();});
  }
  roster.append(b);
}
// stage
const big=document.getElementById("big");
draws.push({cv:big, skin:()=>sel, anim:()=>anim, hue:()=>hue});
const states=document.getElementById("states");
ANIMS.forEach((a,i)=>{const b=document.createElement("button");b.type="button";b.className="state";
  b.innerHTML=`${a.label}<small>${a.state}</small>`; b.addEventListener("click",()=>{anim=i;refresh();}); states.append(b);});
// agent panel
const agentSel=document.getElementById("agent");
for(const a of AGENTS){const o=document.createElement("option");o.value=a.id;o.textContent=a.name;agentSel.append(o);}
agentSel.addEventListener("change",()=>{const a=AGENTS.find(x=>x.id===agentSel.value); sel=a.skin; hue=a.hue; document.getElementById("hue").value=hue; refresh();});
document.getElementById("hue").addEventListener("input",e=>{hue=+e.target.value; refresh();});
const sessions=document.getElementById("sessions");
function renderSessions(){
  sessions.innerHTML=""; draws.splice(0, draws.length, ...draws.filter(d=>!d.sess));
  for(const a of AGENTS){const r=document.createElement("div");r.className="sess";const cv=mkCanvas();
    r.append(cv); const n=document.createElement("span"); n.textContent=a.name; r.append(n);
    const st=document.createElement("span"); st.className="st"; st.textContent=ANIMS[a.anim].state; r.append(st);
    draws.push({cv, skin:()=>a.skin, anim:()=>a.anim, hue:()=>a.hue, sess:true}); sessions.append(r);}
}
document.getElementById("apply").addEventListener("click",()=>{
  const a=AGENTS.find(x=>x.id===agentSel.value); a.skin=sel; a.hue=hue; renderSessions();
  const nm=SKINS.find(s=>s.id===sel).name;
  document.getElementById("toast").textContent=`${a.name} ahora es ${nm}${hue?` (${hue}°)`:""}.`;
});
function refresh(){
  const s=SKINS.find(x=>x.id===sel);
  document.querySelectorAll(".card").forEach((c,i)=>{ if(!SKINS[i].locked) c.setAttribute("aria-pressed", SKINS[i].id===sel); });
  states.querySelectorAll(".state").forEach((b,i)=>b.setAttribute("aria-pressed", i===anim));
  document.getElementById("hudName").textContent=s.name;
  document.getElementById("hudState").textContent=ANIMS[anim].state;
  document.getElementById("hueVal").textContent=hue+"°";
  const a=ANIMS[anim], n=s.rows[anim]||0, m=ms(s,anim);
  document.getElementById("meta").innerHTML=
    `<dt>Fila</dt><dd>${a.row} · ${a.key}</dd><dt>Frames</dt><dd>${n?`${n} × ${m.length>1?m.join("/"):m[0]} ms`:"vacía → usa idle"}</dd>`+
    `<dt>Celda</dt><dd>${s.fw}×${s.fh} px, escala 2.5×</dd><dt>Detalle</dt><dd>${s.note}</dd>`;
}
agentSel.value="a1"; renderSessions(); refresh(); requestAnimationFrame(loop);
</script>

</body></html>
